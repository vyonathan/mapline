version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mapline
      POSTGRES_USER: mapline
      POSTGRES_PASSWORD: mapline
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mapline -d mapline']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
